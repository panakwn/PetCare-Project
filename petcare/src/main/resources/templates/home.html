<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{base}">
<head>
    <title>PetCare - Αρχική</title>
</head>
<body>

<div layout:fragment="content">
    <div class="p-5 mb-4 bg-light rounded-3">
        <div class="container-fluid py-5">
            <h1 class="display-5 fw-bold">Καλώς ήρθατε στο PetCare</h1>
            <p class="col-md-8 fs-4">Η ολοκληρωμένη πλατφόρμα φροντίδας για τους αγαπημένους σας φίλους. Κλείστε ραντεβού με κτηνίατρο εύκολα και γρήγορα.</p>

            <div sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="btn btn-primary btn-lg" type="button">Σύνδεση</a>
                <a th:href="@{/register}" class="btn btn-outline-secondary btn-lg" type="button">Εγγραφή</a>
            </div>

            <div sec:authorize="isAuthenticated()">
                <p class="mt-3">Γεια σας, <span sec:authentication="name" class="fw-bold">User</span>!</p>
                <a th:href="@{/appointments/new}" class="btn btn-success btn-lg">Κλείστε Ραντεβού Τώρα</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
