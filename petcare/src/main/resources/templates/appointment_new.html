<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">
<head>
  <title>Κλείσιμο Ραντεβού</title>
</head>
<body>
<div layout:fragment="content">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header bg-success text-white">
          <h4 class="mb-0">Νέο Ραντεβού</h4>
        </div>
        <div class="card-body">

          <form th:action="@{/appointments/new}" th:object="${scheduleAppointmentRequest}" method="post">

            <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
              <ul>
                <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
              </ul>
            </div>
            <div class="mb-3">
              <label for="petId" class="form-label">Επιλέξτε Κατοικίδιο</label>
              <select class="form-select" id="petId" th:field="*{petId}" required>
                <option value="" disabled selected>-- Επιλογή --</option>
                <option th:each="pet : ${pets}"
                        th:value="${pet.id}"
                        th:text="${pet.name}"></option>
              </select>
            </div>

            <div class="mb-3">
              <label for="vetId" class="form-label">Επιλέξτε Κτηνίατρο</label>
              <select class="form-select" id="vetId" th:field="*{vetId}" required>
                <option value="" disabled selected>-- Επιλογή --</option>
                <option th:each="vet : ${vets}"
                        th:value="${vet.id}"
                        th:text="${'Dr. ' + vet.firstName + ' ' + vet.lastName}"></option>
              </select>
            </div>

            <div class="mb-3">
              <label for="date" class="form-label">Ημερομηνία & Ώρα</label>
              <input type="datetime-local" class="form-control" id="date" th:field="*{date}" required>
            </div>
            <div class="mb-3">
              <label for="description" class="form-label">Αιτία Επίσκεψης</label>
              <textarea class="form-control" id="description" th:field="*{description}" rows="3" placeholder="π.χ. Ετήσιος εμβολιασμός"></textarea>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-success">Κράτηση Ραντεβού</button>
              <a th:href="@{/appointments}" class="btn btn-secondary">Ακύρωση</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
