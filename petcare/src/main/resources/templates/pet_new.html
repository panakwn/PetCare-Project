<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">
<head>
    <title>Add Pet</title>
</head>
<body>

<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0">🐾 New Pet</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/pets/new}" th:object="${createPetRequest}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{name}"
                                   placeholder="e.g. Max"
                                   required>
                            <p class="text-danger"
                               th:if="${#fields.hasErrors('name')}"
                               th:errors="*{name}"></p>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Animal Type</label>
                            <select class="form-select" th:field="*{animalType}" required>
                                <option value="" disabled selected>-- Select --</option>
                                <option value="DOG">Dog</option>
                                <option value="CAT">Cat</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Breed (Optional)</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{breed}"
                                   placeholder="e.g. Labrador">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Birth Date</label>
                            <input type="date"
                                   class="form-control"
                                   th:field="*{birthDate}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Weight (kg)</label>
                            <input type="number"
                                   step="0.1"
                                   class="form-control"
                                   th:field="*{weight}"
                                   placeholder="e.g. 12.5">
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-warning">Save</button>
                            <a th:href="@{/pets}" class="btn btn-secondary">Cancel</a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
