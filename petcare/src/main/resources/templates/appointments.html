<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">
<head>
    <title>Τα Ραντεβού μου</title>
</head>
<body>

<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Λίστα Ραντεβού</h2>
        <a th:href="@{/appointments/new}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Νέο Ραντεβού
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Ημερομηνία</th>
                <th>Κατοικίδιο</th>
                <th>Κτηνίατρος</th>
                <th>Αιτία</th>
                <th>Κατάσταση</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="app : ${appointments}">
                <td th:text="${app.id}">1</td>
                <td th:text="${#temporals.format(app.date, 'dd-MM-yyyy HH:mm')}">12-01-2026 10:00</td>
                <td th:text="${app.pet.name}">Max</td>
                <td th:text="${'Dr. ' + app.vet.lastName}">Dr. House</td>
                <td th:text="${app.description}">Εμβόλιο</td>
                <td>
                    <span class="badge bg-info text-dark" th:text="${app.status}">SCHEDULED</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(appointments)}">
                <td colspan="6" class="text-center text-muted">Δεν υπάρχουν προγραμματισμένα ραντεβού.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
