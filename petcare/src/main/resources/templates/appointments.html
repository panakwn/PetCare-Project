<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Appointments</title>

    <style>
        /* Prevent horizontal overflow */
        html, body {
            max-width: 100%;
            overflow-x: hidden;
        }

        table td, table th {
            word-break: break-word;
            white-space: normal;
        }

        .pet-emoji {
            font-size: clamp(3rem, 8vw, 5rem);
        }
    </style>
</head>
<body>

<div layout:fragment="content">

    <h2 class="mb-4">My Appointments</h2>

    <div th:if="${#lists.isEmpty(appointments)}" class="alert alert-info">
        No upcoming appointments found.
    </div>

    <!-- Responsive table wrapper -->
    <div class="table-responsive" th:if="${!#lists.isEmpty(appointments)}">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>Date & Time</th>
                <th>Pet</th>
                <th th:if="${isVet}">Owner</th>
                <th th:unless="${isVet}">Vet</th>
                <th>Description</th>
                <th>Status</th>
                <th th:if="${isVet}">Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="app : ${appointments}">
                <td th:text="${#temporals.format(app.date, 'dd-MM-yyyy HH:mm')}"></td>

                <td>
                    <a href="#" class="fw-bold text-primary text-decoration-none"
                       data-bs-toggle="modal"
                       th:data-bs-target="'#petModal-' + ${app.id}">
                        <i class="bi bi-info-circle"></i>
                        <span th:text="${app.pet.name}"></span>
                    </a>

                    <!-- Modal -->
                    <div class="modal fade"
                         th:id="'petModal-' + ${app.id}"
                         tabindex="-1"
                         aria-hidden="true">
                        <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
                            <div class="modal-content">
                                <div class="modal-header bg-info text-white">
                                    <h5 class="modal-title">
                                        🐾 Details: <span th:text="${app.pet.name}"></span>
                                    </h5>
                                    <button type="button" class="btn-close"
                                            data-bs-dismiss="modal"></button>
                                </div>

                                <div class="modal-body">
                                    <div class="text-center mb-3">
                                        <h1 th:if="${app.pet.species == 'DOG'}" class="pet-emoji">🐕</h1>
                                        <h1 th:if="${app.pet.species == 'CAT'}" class="pet-emoji">🐈</h1>
                                        <h1 th:if="${app.pet.species != 'DOG' and app.pet.species != 'CAT'}"
                                            class="pet-emoji">🐾</h1>
                                    </div>

                                    <ul class="list-group list-group-flush mb-3">
                                        <li class="list-group-item">
                                            <strong>Species:</strong>
                                            <span th:text="${app.pet.species}"></span>
                                        </li>
                                        <li class="list-group-item">
                                            <strong>Breed:</strong>
                                            <span th:text="${app.pet.breed}"></span>
                                        </li>
                                        <li class="list-group-item">
                                            <strong>Age:</strong>
                                            <span th:text="${app.pet.age}"></span> years
                                        </li>
                                        <li class="list-group-item text-muted">
                                            <small>
                                                Owner:
                                                <span th:text="${app.pet.owner.firstName + ' ' + app.pet.owner.lastName}"></span>
                                            </small>
                                        </li>
                                    </ul>

                                    <div class="card bg-light">
                                        <div class="card-body">
                                            <h6 class="card-title">
                                                <i class="bi bi-journal-medical"></i>
                                                Medical History / Notes
                                            </h6>

                                            <form th:if="${isVet}"
                                                  th:action="@{/pets/{id}/notes(id=${app.pet.id})}"
                                                  method="post">
                                                <textarea class="form-control mb-2 text-break"
                                                          name="notes"
                                                          rows="3"
                                                          th:text="${app.pet.vetNotes}"
                                                          placeholder="Write notes for the pet..."></textarea>
                                                <button class="btn btn-primary btn-sm w-100"
                                                        type="submit">
                                                    Save Notes
                                                </button>
                                            </form>

                                            <p th:unless="${isVet}"
                                               class="card-text text-muted fst-italic text-break">
                                                <span th:if="${app.pet.vetNotes == null or app.pet.vetNotes == ''}">
                                                    No notes available yet.
                                                </span>
                                                <span th:text="${app.pet.vetNotes}"></span>
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                <div class="modal-footer">
                                    <button type="button"
                                            class="btn btn-secondary"
                                            data-bs-dismiss="modal">
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </td>

                <td th:if="${isVet}"
                    th:text="${app.pet.owner.lastName + ' ' + app.pet.owner.firstName}"></td>

                <td th:unless="${isVet}"
                    th:text="${'Dr. ' + app.vet.lastName}"></td>

                <td th:text="${app.description}"></td>

                <td>
                    <span th:if="${app.status == 'SCHEDULED'}" class="badge bg-primary">Scheduled</span>
                    <span th:if="${app.status == 'COMPLETED'}" class="badge bg-success">Completed</span>
                    <span th:if="${app.status == 'CANCELLED'}" class="badge bg-danger">Cancelled</span>
                </td>

                <td th:if="${isVet}">
                    <div th:if="${app.status == 'SCHEDULED'}" class="d-flex gap-2 flex-wrap">
                        <form th:if="${app.startTime != null and app.startTime.isBefore(#temporals.createNow())}"
                              th:action="@{/appointments/{id}/complete(id=${app.id})}"
                              method="post">
                            <button class="btn btn-success btn-sm">
                                <i class="bi bi-check-lg"></i>
                            </button>
                        </form>

                        <form th:action="@{/appointments/{id}/cancel(id=${app.id})}"
                              method="post"
                              onsubmit="return confirm('Are you sure you want to cancel this appointment?');">
                            <button class="btn btn-danger btn-sm">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </form>

                        <span th:if="${app.startTime != null and app.startTime.isAfter(#temporals.createNow())}"
                              class="text-muted small align-self-center">
                            Wait
                        </span>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3" th:unless="${isVet}">
        <a th:href="@{/appointments/new}" class="btn btn-primary">
            Schedule New Appointment
        </a>
    </div>
</div>

</body>
</html>
